<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>OpenCut — Offline</title>
	<style>
		body { margin: 0; font-family: system-ui, sans-serif; background: #0a0a0a; color: #f5f5f5;
			display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 1.5rem; }
		main { max-width: 28rem; text-align: center; }
		h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
		p { color: #a3a3a3; line-height: 1.5; margin: 0 0 1rem; }
		button { background: #f5f5f5; color: #0a0a0a; border: 0; border-radius: 0.5rem;
			padding: 0.6rem 1rem; font-weight: 600; cursor: pointer; }
	</style>
</head>
<body>
	<main>
		<h1>You’re offline</h1>
		<p>OpenCut’s shell is still available. Projects saved in this browser remain on this device. Network features (model download, cloud) need a connection.</p>
		<button type="button" onclick="location.reload()">Retry</button>
	</main>
</body>
</html>
