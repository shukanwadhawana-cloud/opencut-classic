# OpenCut Classic — Render Blueprint (PWA web service)
# Dashboard: https://dashboard.render.com → New → Blueprint → connect this repo
# DATABASE_URL is optional: editor projects save in the browser.

services:
  - type: web
    name: opencut-classic
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: bun install && bun run build:web
    startCommand: bash apps/web/scripts/render-start.sh
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUN_VERSION
        value: "1.2.18"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_MARBLE_API_URL
        value: https://api.marblecms.com

